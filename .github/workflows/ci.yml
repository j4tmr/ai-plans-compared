name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check generated files
        run: |
          if ! git diff --exit-code -- public data README.md; then
            echo "::error::Generated files are stale. Run 'npm run build' and commit the result."
            exit 1
          fi
