name: Price correction
description: Report a changed plan price or quota.
labels: ["data", "pricing"]
body:
  - type: input
    id: platform
    attributes:
      label: Platform and plan
      placeholder: WorkBuddy 标准版
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official page URL
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Exact text
      description: Paste the price, quota and billing-condition text.
    validations:
      required: true
  - type: input
    id: seen-at
    attributes:
      label: Seen at
      placeholder: "2026-11-01"
    validations:
      required: true
