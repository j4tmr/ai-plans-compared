<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160" role="img" aria-labelledby="title desc">
  <title id="title">88API Claude 中转站：Opus / Sonnet / Haiku 全系模型，注册送测试额度</title>
  <desc id="desc">Compact mobile 88API promotional banner for a Claude relay with Claude Code support and sign-up bonus credits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#251410"/>
      <stop offset=".58" stop-color="#382015"/>
      <stop offset="1" stop-color="#4b2b1c"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8825e"/>
      <stop offset="1" stop-color="#c4532f"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fff" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="800" height="160" rx="18" fill="url(#bg)"/>
  <rect width="800" height="160" rx="18" fill="url(#dots)"/>
  <circle cx="748" cy="-18" r="108" fill="#e06a3f" opacity=".14"/>

  <g transform="translate(20 54)">
    <rect width="52" height="52" rx="13" fill="url(#clay)"/>
    <g stroke="#fff" stroke-width="4.5" stroke-linecap="round">
      <path d="M26 13v26"/>
      <path d="M13 26h26"/>
      <path d="m17 17 18 18"/>
      <path d="M35 17 17 35"/>
    </g>
  </g>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="88" y="70" font-size="26" font-weight="800" letter-spacing="-.4" fill="#fff">88API</text>
    <text x="168" y="68" font-size="14" font-weight="600" fill="#f0a582">Claude 中转站</text>
    <text x="88" y="102" font-size="14.5" fill="#f2ddcd">Claude Code 直连 · Opus / Sonnet / Haiku 全系可用</text>
  </g>

  <g transform="translate(484 48)">
    <rect width="296" height="64" rx="32" fill="url(#clay)"/>
    <text x="24" y="41" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" fill="#fff">注册送测试额度</text>
    <path d="M252 32h20m0 0-8-8m8 8-8 8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
