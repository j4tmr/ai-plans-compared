<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">88API Claude 中转站：Opus / Sonnet / Haiku 全系模型，注册送测试额度</title>
  <desc id="desc">88API promotional banner for a Claude relay with Claude Code support and sign-up bonus credits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#251410"/>
      <stop offset=".58" stop-color="#382015"/>
      <stop offset="1" stop-color="#4b2b1c"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8825e"/>
      <stop offset="1" stop-color="#c4532f"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#fff" opacity=".08"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="200" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="200" rx="18" fill="url(#dots)"/>
  <circle cx="1040" cy="18" r="150" fill="#e06a3f" opacity=".13"/>
  <circle cx="744" cy="190" r="120" fill="#d95f36" opacity=".1" filter="url(#soft)"/>
  <path d="M0 200 250 0h84L84 200Z" fill="#fff" opacity=".03"/>

  <g transform="translate(56 48)">
    <rect width="104" height="104" rx="26" fill="url(#clay)"/>
    <g stroke="#fff" stroke-width="7" stroke-linecap="round">
      <path d="M52 30v44"/>
      <path d="M30 52h44"/>
      <path d="M37 37l30 30"/>
      <path d="M67 37l-30 30"/>
    </g>
  </g>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="190" y="85" font-size="50" font-weight="800" letter-spacing="-1" fill="#fff">88API</text>
    <text x="345" y="82" font-size="25" font-weight="600" fill="#f0a582">Claude 中转站</text>
    <text x="190" y="130" font-size="23" fill="#f2ddcd">Claude Code 直连 · Opus / Sonnet / Haiku 全系可用</text>
  </g>

  <g transform="translate(742 57)">
