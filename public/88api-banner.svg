    <text x="34" y="36" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#ffd9c4">新人福利</text>
    <text x="34" y="70" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="29" font-weight="800" fill="#fff">送测试额度</text>
    <text x="216" y="57" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#fff">立即注册</text>
    <path d="M330 43h30m0 0-12-12m12 12-12 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
